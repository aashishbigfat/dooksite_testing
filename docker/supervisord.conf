; Runs php-fpm and nginx side-by-side in one container listening on port 80.
; Kept as one container rather than two so the whole app is a single unit to
; start, stop and restart on the Compute Engine VM (see docker/dookwebsite.service).
;
; Both programs log to the container's stdout/stderr, which the Docker
; gcplogs/json-file driver forwards to Cloud Logging on the VM.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
