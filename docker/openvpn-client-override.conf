# systemd drop-in for the OpenVPN tunnel that carries database traffic.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/openvpn-client@dook.service.d
#   sudo cp docker/openvpn-client-override.conf \
#           /etc/systemd/system/openvpn-client@dook.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart openvpn-client@dook
#
# Debian's stock openvpn-client@.service uses Restart=on-failure, which does
# not cover the case that matters most here: the tunnel dying cleanly (server
# restart, session revoked, idle timeout). That exits 0 and leaves the site
# unable to reach 192.168.4.7 with nothing restarting it.
#
# Restart=always covers both. The healthcheck timer is still needed for the
# case where the process is alive but the tunnel is not passing traffic -
# systemd cannot see that.

# Don't let a flapping tunnel trip systemd's rate limiter and stay down.
# StartLimitIntervalSec belongs in [Unit] on systemd 229+ (Debian 12 ships
# 252); in [Service] it is silently ignored with an "Unknown key" warning.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=10
