# nginx site config for the Laravel app + the legacy public/book
# (CodeIgniter) sub-app, both served out of the same public/ docroot.
#
# This intentionally does NOT read public/.htaccess or public/book/.htaccess
# - nginx never processes .htaccess files, which is also true of the
# `php artisan serve` setup already used for local dev, so this is not a
# behavior regression. The one rule from public/.htaccess deliberately NOT
# reproduced here is "Force HTTPS + WWW", since that would redirect-loop
# plain http://localhost testing.
#
# TLS terminates in front of this container, not inside it: on Compute
# Engine that is either a Google Cloud HTTP(S) Load Balancer or an nginx /
# Caddy reverse proxy on the VM itself. Whichever is used, it must forward
# X-Forwarded-Proto, and Laravel must be told to trust it - otherwise
# url()/asset() emit http:// links on an https:// page and browsers block
# them as mixed content. See the TLS section of DOCKER.md.

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 200M;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/x-javascript
        application/xml application/rss+xml application/xhtml+xml
        image/svg+xml font/woff font/woff2;

    # Block dotfiles (.env, .git, etc.) if ever requested directly
    location ~ /\.(?!well-known) {
        deny all;
    }

    # --- Legacy CodeIgniter sub-app at /book -----------------------------
    # Mirrors public/book/.htaccess's "route everything through
    # index.php/$1" rule, since nginx can't read that .htaccess itself.
    location /book/ {
        try_files $uri $uri/ @book;
    }

    location @book {
        rewrite ^/book/(.*)$ /book/index.php/$1 last;
    }

    location ~ ^/book/index\.php(/|$) {
        fastcgi_split_path_info ^(/book/index\.php)(/.*)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 1200;
    }

    # --- Laravel front controller ----------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 1200;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
