# nginx site config for the Laravel app + the legacy public/book
# (CodeIgniter) sub-app, both served out of the same public/ docroot.
#
# This intentionally does NOT read public/.htaccess or public/book/.htaccess
# - nginx never processes .htaccess files, which is also true of the
# `php artisan serve` setup already used for local dev, so this is not a
# behavior regression.
#
# TLS is terminated by THIS nginx directly (not a separate host proxy or a
# Google Cloud Load Balancer) - certificate from Let's Encrypt for
# dook.bigfat.ai, obtained via certbot on the VM host and bind-mounted in
# read-only. Because this same process terminates TLS and serves the app,
# Laravel does not need TrustProxies/X-Forwarded-Proto - it sees the real
# scheme directly via the fastcgi_param HTTPS below.
#
# Renewal: certbot's systemd timer handles it; a deploy-hook reloads nginx
# inside this container afterward so the new cert actually gets picked up
# (nginx does not notice changed files under an existing mount on its own).

server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Let's Encrypt HTTP-01 challenge - always plain HTTP, checked before
    # the redirect below so renewal keeps working once HTTPS is live.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect to the FIXED domain, not https://$host$request_uri. The
    # certificate is only valid for dook.bigfat.ai - redirecting a bare-IP
    # request to https://<IP> would land on a hostname with no valid cert
    # and just fail. Redirecting to the fixed name always lands somewhere
    # that works, however this was reached.
    location / {
        return 301 https://dook.bigfat.ai$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dook.bigfat.ai;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 200M;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    ssl_certificate     /etc/letsencrypt/live/dook.bigfat.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dook.bigfat.ai/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/x-javascript
        application/xml application/rss+xml application/xhtml+xml
        image/svg+xml font/woff font/woff2;

    # Block dotfiles (.env, .git, etc.) if ever requested directly
    location ~ /\.(?!well-known) {
        deny all;
    }

    # --- Legacy CodeIgniter sub-app at /book -----------------------------
    # Mirrors public/book/.htaccess's "route everything through
    # index.php/$1" rule, since nginx can't read that .htaccess itself.
    location /book/ {
        try_files $uri $uri/ @book;
    }

    location @book {
        rewrite ^/book/(.*)$ /book/index.php/$1 last;
    }

    location ~ ^/book/index\.php(/|$) {
        fastcgi_split_path_info ^(/book/index\.php)(/.*)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 1200;
    }

    # --- Blog post images, served from the dookblog container --------------
    # Blog featured images live in the dookblog container, not in this app's
    # docroot - this site has no public/images/posts/ at all, so without this
    # block those requests fall through to the static-asset regex below and
    # 404.
    #
    # 127.0.0.1:8001 works because the dookblog container shares THIS
    # container's network namespace (see dookblog's docker-compose.prod.yml),
    # so its port appears on this loopback exactly as it does on a developer
    # machine.
    #
    # Why this exists: ApiBlogController builds absolute image URLs from the
    # host the API was called on, and this site drops them straight into
    # <img src>. Serving them here lets those URLs be https://dook.bigfat.ai/...
    # instead of pointing at the legacy blog host, so the blog is self-contained
    # on this domain.
    #
    # Deliberately scoped to /images/posts/ - the featured images, which the
    # API regenerates on every response. It does NOT cover /images/post-media/
    # (images inside post bodies): those URLs were written into the stored post
    # HTML as absolute links when an editor uploaded them, so they point at
    # whichever host the CMS was on and cannot be redirected from here. Fixing
    # those means rewriting stored content in the database.
    #
    # ^~ so this wins over the static-asset regex below, which would otherwise
    # match .jpg first and try to serve it from disk.
    location ^~ /images/posts/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- Laravel front controller ----------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Without this, PHP has no way to know the connection was actually
        # TLS - $request->secure() would report false on a page that IS
        # encrypted, since nginx does not pass this along by default.
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 1200;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
