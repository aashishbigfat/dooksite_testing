; php-fpm pool sized around the Redis plan's client limit.
;
; With persistent Redis connections (config/database.php) each *busy* php-fpm
; worker holds one connection to Redis. The plan allows 30 clients in total,
; across every container plus anything else that connects, so the worker count
; is the connection budget - not a throughput knob to raise casually.
;
;   30 clients allowed
;  -  5 reserved for redis-cli / monitoring / headroom
;  = 25 usable  ->  10 per container leaves room for two containers
;
; 'ondemand' matters here: workers are spawned only when there is traffic and
; are reaped after process_idle_timeout, releasing their Redis connection with
; them. A 'static' or 'dynamic' pool would hold all 10 connections open around
; the clock even while idle.
;
; On a single Compute Engine VM this leaves plenty of headroom. Raise
; pm.max_children only alongside the Redis plan - and if you ever run more
; than two instances, lower it to match, or the extra workers are refused by
; Redis. That refusal is handled gracefully (the app falls back to the
; database) but the cache stops paying off.
;
; clear_env = no at the bottom of this file is load-bearing, not cosmetic:
; the entrypoint runs `artisan config:cache`, after which Laravel no longer
; reads .env, so the bare env() calls in app/Http/Helper/Helper.php
; (GOOGLE_CLOUD_STORAGE_BUCKET, GOOGLE_CLOUD_KEY_FILE) resolve only from the
; worker's real process environment. Setting clear_env = yes would strip
; them and every Cloud Storage URL would come back null.

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Surface worker errors in the container log rather than swallowing them.
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

clear_env = no
