; Runtime overrides for the container, mirroring the limits the production
; cPanel host already applies via public/.htaccess and public/book/.htaccess
; (php_value memory_limit / post_max_size / upload_max_filesize / etc.)
; so local Docker testing has the same headroom production has.

memory_limit = 2024M
upload_max_filesize = 200M
post_max_size = 200M
max_execution_time = 1200
max_input_time = 220
max_input_vars = 1000
session.gc_maxlifetime = 7200

expose_php = Off
date.timezone = UTC

; OPcache - safe for local testing too since the image is rebuilt on
; every code change (validate_timestamps stays on so edits are picked up
; without a restart during `docker compose up` iteration).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
