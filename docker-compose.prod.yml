# Production compose file for the Google Compute Engine VM.
#
# Differences from docker-compose.yml (the local test file):
#   - No JSON key mounted. Google Cloud Storage authenticates through the
#     VM's attached service account (Application Default Credentials), so
#     no long-lived key exists on the VM or in the image.
#   - Publishes on port 80 rather than 8080.
#   - Logs to Cloud Logging via the gcplogs driver.
#
# Works two ways, so the same file covers the first deploy and later ones:
#
#   1. Build on the VM from a GitHub clone (what explainers/gcp_hosting_guide.md
#      uses - no Artifact Registry needed):
#        docker compose -f docker-compose.prod.yml build
#        docker compose -f docker-compose.prod.yml up -d
#
#   2. Pull a pre-built tagged image from Artifact Registry, once you want
#      builds off the VM. Set IMAGE in /etc/dookwebsite/deploy.env:
#        IMAGE=<REGION>-docker.pkg.dev/<PROJECT>/dookwebsite/app:2026-08-22
#        docker compose -f docker-compose.prod.yml pull && ... up -d
#      Pin a real tag; ':latest' makes it impossible to tell what is running
#      or to roll back to what was running before.
#
# Started at boot by docker/dookwebsite.service.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ${IMAGE:-dookwebsite:prod}

    # 80 for the ACME challenge and the http->https redirect; 443 for the
    # site itself. TLS is terminated by THIS container's own nginx (not a
    # separate host proxy or load balancer) - see docker/nginx.conf.
    ports:
      - "80:80"
      - "443:443"

    # Real env vars, never baked into the image. Copy docker/env.gcp.example
    # to this path on the VM and fill it in.
    env_file:
      - /etc/dookwebsite/app.env

    volumes:
      # Laravel logs, kept on the host so they survive a container replacement.
      - /var/lib/dookwebsite/storage-logs:/var/www/html/storage/logs
      # Google Cloud Storage credentials, read-only, never baked into the
      # image. Required rather than optional here: gs://dooktravels lives in
      # a project this account cannot administer, so the VM's own service
      # account cannot be granted access to it and signed URLs would 403.
      # Path must match GOOGLE_CLOUD_KEY_FILE in /etc/dookwebsite/app.env.
      #
      # Must be owned by uid 33 (www-data) on the host, NOT root. php-fpm's
      # master process runs as root but its WORKERS - the ones that actually
      # handle requests - run as www-data (docker/www.conf). A root-owned
      # file is unreadable to them. Hit this exact bug during deployment:
      # `docker compose exec` (runs as root) could read a root-owned key and
      # falsely passed, while every real page that rendered an image logged
      # "Permission denied" and 302'd to the homepage.
      - /etc/dookwebsite/gcs-key.json:/etc/dookwebsite/gcs-key.json:ro
      # Let's Encrypt challenge files. certbot (on the host) writes here;
      # nginx's acme-challenge location (docker/nginx.conf) serves them.
      # Read-only in the container - only certbot on the host writes to it.
      - /var/lib/dookwebsite/certbot-webroot:/var/www/certbot:ro
      # The certificate + key themselves, read-only. nginx's MASTER process
      # (root) reads these at startup/reload - not the www-data WORKERS - so
      # the usual private-key permission problem does not apply here the way
      # it did for the GCS key; no special chown needed.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # DB credentials for the legacy CodeIgniter 4 booking sub-app
      # (public/book/). Its own Config/Database.php ships with blank
      # placeholder values and is overridden at runtime by a CI4-format
      # .env - a file that (like GOOGLE credentials) never belongs in git
      # or the image. Points at the SAME Cloud SQL instance/credentials as
      # the main app's DB_* vars above. Must be owned by uid 33 (www-data)
      # - same reason as the GCS key.
      #
      # Mount path is public/book/APP/.env, NOT public/book/.env. CI4's
      # own Boot::loadDotEnv() calls `new DotEnv($paths->appDirectory)`,
      # i.e. it reads from the app/ subdirectory, not the CI4 project
      # root most CI4 docs/examples assume. Got this wrong once already -
      # confirmed by reading Boot.php directly, not guessed.
      - /etc/dookwebsite/book.env:/var/www/html/public/book/app/.env:ro

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    restart: always

    # Ship container stdout/stderr to Cloud Logging. Requires the VM's
    # service account to hold roles/logging.logWriter.
    logging:
      driver: gcplogs
      options:
        gcp-log-cmd: "true"

    # A runaway request should not take the whole VM down with it. This is a
    # blast-radius limit, not a guarantee of headroom: docker/php.ini keeps
    # the cPanel host's memory_limit of 2024M per request, so 10 workers
    # (docker/www.conf) could in theory ask for ~20 GB. What actually bounds
    # concurrent memory is pm.max_children, not this number.
    #
    # Sized for the e2-standard-2 (8 GB) in DOCKER.md, leaving ~2 GB for the
    # host. Raise it with the machine type, not on its own.
    deploy:
      resources:
        limits:
          memory: 6g
